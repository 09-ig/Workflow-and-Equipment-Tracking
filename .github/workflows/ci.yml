name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore "C# project.sln"

      - name: Build
        run: dotnet build "C# project.sln" --configuration Release --no-restore

      - name: Test
        run: dotnet test "C# project.sln" --configuration Release --no-build --verbosity normal
