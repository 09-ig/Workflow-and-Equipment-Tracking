name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ created ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, Test & Publish
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore "C# project.sln"

      - name: Build (Release)
        run: dotnet build "C# project.sln" --configuration Release --no-restore

      - name: Test
        run: dotnet test "C# project.sln" --configuration Release --no-build --verbosity normal

      - name: Publish self-contained executable
        run: >
          dotnet publish AeroMaintain
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AeroMaintain-win-x64
          path: ./publish/AeroMaintain.exe

      - name: Attach executable to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ./publish/AeroMaintain.exe
